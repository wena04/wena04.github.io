<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-label="Mini Google">
  <defs>
    <linearGradient id="mg-bg" x1="0" y1="0" x2="320" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfbfd"/>
      <stop offset="1" stop-color="#eef1f7"/>
    </linearGradient>
  </defs>

  <rect width="320" height="120" rx="10" fill="url(#mg-bg)"/>
  <rect x="1" y="1" width="318" height="118" rx="9" fill="none" stroke="#dde2ee" stroke-width="1.5"/>

  <!-- mock search bar -->
  <rect x="18" y="18" width="180" height="20" rx="10" fill="#ffffff" stroke="#dbe0ec" stroke-width="1.5"/>
  <circle cx="30" cy="28" r="5" fill="none" stroke="#3a6df0" stroke-width="2"/>
  <line x1="34" y1="32" x2="38" y2="36" stroke="#3a6df0" stroke-width="2" stroke-linecap="round"/>
  <rect x="46" y="25" width="120" height="6" rx="3" fill="#e3e7f0"/>

  <!-- mock result rows (crawled/indexed pages) -->
  <g>
    <rect x="18" y="52" width="14" height="14" rx="3" fill="#3a6df0"/>
    <rect x="38" y="55" width="130" height="4" rx="2" fill="#c7cee0"/>
    <rect x="38" y="62" width="90" height="3.5" rx="2" fill="#dbe0ec"/>
  </g>
  <g>
    <rect x="18" y="74" width="14" height="14" rx="3" fill="#7c5cf0"/>
    <rect x="38" y="77" width="110" height="4" rx="2" fill="#c7cee0"/>
    <rect x="38" y="84" width="75" height="3.5" rx="2" fill="#dbe0ec"/>
  </g>
  <g>
    <rect x="18" y="96" width="14" height="14" rx="3" fill="#f0a63a"/>
    <rect x="38" y="99" width="95" height="4" rx="2" fill="#c7cee0"/>
  </g>

  <!-- large magnifying glass mark -->
  <g transform="translate(258,54)">
    <circle r="26" fill="#ffffff" stroke="#e3e7f0" stroke-width="1.5"/>
    <circle r="15" fill="none" stroke="#3a6df0" stroke-width="5"/>
    <line x1="11" y1="11" x2="21" y2="21" stroke="#f0a63a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="196" y="112" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="14" letter-spacing="0.5" fill="#4c5568">mini <tspan font-weight="800" fill="#26304a">Google</tspan></text>
</svg>
