<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-label="Breakpoint">
  <defs>
    <linearGradient id="bp-bg" x1="0" y1="0" x2="320" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#141b2e"/>
    </linearGradient>
    <linearGradient id="bp-line" x1="0" y1="120" x2="320" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6b35"/>
      <stop offset="1" stop-color="#3ddc84"/>
    </linearGradient>
  </defs>

  <rect width="320" height="120" rx="10" fill="url(#bp-bg)"/>
  <rect x="1" y="1" width="318" height="118" rx="9" fill="none" stroke="#2a3350" stroke-width="1.5"/>

  <!-- market grid -->
  <g stroke="#232c47" stroke-width="1">
    <line x1="0" y1="30" x2="320" y2="30"/>
    <line x1="0" y1="60" x2="320" y2="60"/>
    <line x1="0" y1="90" x2="320" y2="90"/>
  </g>

  <!-- rising market line -->
  <polyline points="18,92 55,78 92,84 129,58 166,66 203,40 240,48 268,26"
    fill="none" stroke="url(#bp-line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#3ddc84">
    <circle cx="18" cy="92" r="2.6"/><circle cx="55" cy="78" r="2.6"/><circle cx="92" cy="84" r="2.6"/>
    <circle cx="129" cy="58" r="2.6"/><circle cx="166" cy="66" r="2.6"/><circle cx="203" cy="40" r="2.6"/>
    <circle cx="240" cy="48" r="2.6"/>
  </g>

  <!-- tennis ball riding the breakout point -->
  <g transform="translate(268,26)">
    <circle r="10" fill="#d8f24a"/>
    <path d="M -8 -5 Q 0 3 -2 10" fill="none" stroke="#0b0f1a" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 8 -5 Q 0 3 2 10" fill="none" stroke="#0b0f1a" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <text x="18" y="112" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="15" letter-spacing="2" fill="#f2f5ff">BREAKPOINT</text>
</svg>
